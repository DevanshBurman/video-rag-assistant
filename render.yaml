services:
  - type: web
    name: video-rag-assistant
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: TRANSCRIBER_BACKEND
        value: groq
      - key: MAX_VIDEO_MINUTES
        value: "90"
      - key: ADMIN_TOKEN
        sync: false
      - key: PROXY_URL
        sync: false
      - key: WEBSHARE_PROXY_USERNAME
        sync: false
      - key: WEBSHARE_PROXY_PASSWORD
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
